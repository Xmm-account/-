<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>链接渗透率更新工具</title>
  <script src="https://cdn.jsdelivr.net/npm/xlsx@0.18.5/dist/xlsx.full.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/xlsx-populate@1.21.0/browser/xlsx-populate.min.js"></script>
  <style>
    :root {
      --bg: #f6f8fb;
      --panel: #ffffff;
      --ink: #172033;
      --muted: #66758d;
      --line: #d9e2ee;
      --soft: #eef5ff;
      --blue: #2563eb;
      --blue-dark: #1d4ed8;
      --green: #0f8c6b;
      --red: #b91c1c;
      --shadow: 0 18px 48px rgba(26, 39, 68, 0.1);
      font-family: Inter, "Segoe UI", "Microsoft YaHei", Arial, sans-serif;
    }

    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      min-height: 100vh;
      color: var(--ink);
      background: var(--bg);
    }

    button,
    input {
      font: inherit;
    }

    button {
      cursor: pointer;
    }

    .shell {
      width: min(1260px, calc(100% - 32px));
      margin: 0 auto;
      padding: 24px 0;
    }

    .layout {
      display: grid;
      grid-template-columns: 340px minmax(0, 1fr);
      min-height: calc(100vh - 48px);
      overflow: hidden;
      border: 1px solid var(--line);
      border-radius: 8px;
      background: var(--panel);
      box-shadow: var(--shadow);
    }

    .side {
      display: flex;
      flex-direction: column;
      gap: 16px;
      padding: 22px;
      color: #f8fafc;
      background: #111827;
    }

    .brand {
      display: flex;
      align-items: center;
      gap: 12px;
    }

    .brand-mark {
      display: grid;
      place-items: center;
      width: 42px;
      height: 42px;
      border-radius: 8px;
      color: #0f172a;
      background: linear-gradient(135deg, #60a5fa, #34d399);
      font-weight: 900;
    }

    h1,
    h2,
    p {
      margin: 0;
    }

    h1 {
      font-size: 24px;
      line-height: 1.15;
      letter-spacing: 0;
    }

    h2 {
      font-size: 19px;
      letter-spacing: 0;
    }

    .hint {
      color: #afbbce;
      font-size: 13px;
      line-height: 1.55;
    }

    .upload,
    .rules {
      display: grid;
      gap: 12px;
      padding: 16px;
      border: 1px solid rgba(255, 255, 255, 0.13);
      border-radius: 8px;
      background: rgba(255, 255, 255, 0.07);
    }

    .file-input {
      position: absolute;
      width: 1px;
      height: 1px;
      overflow: hidden;
      clip: rect(0, 0, 0, 0);
    }

    .file-row {
      display: grid;
      grid-template-columns: 116px minmax(0, 1fr);
      gap: 10px;
      align-items: center;
    }

    .file-label {
      display: grid;
      place-items: center;
      min-height: 40px;
      padding: 0 10px;
      border-radius: 8px;
      color: #0f172a;
      background: #ffffff;
      font-weight: 800;
    }

    .file-name,
    .progress-text {
      min-width: 0;
      overflow: hidden;
      color: #dce5f2;
      font-size: 13px;
      text-overflow: ellipsis;
      white-space: nowrap;
    }

    .file-list {
      display: grid;
      gap: 7px;
      max-height: 160px;
      overflow: auto;
    }

    .file-chip {
      min-height: 34px;
      padding: 8px 10px;
      border-radius: 8px;
      color: #dce5f2;
      background: rgba(255, 255, 255, 0.08);
      border: 1px solid rgba(255, 255, 255, 0.13);
      font-size: 13px;
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
    }

    .progress-track {
      height: 8px;
      overflow: hidden;
      border-radius: 999px;
      background: rgba(255, 255, 255, 0.16);
    }

    .progress-bar {
      width: 0%;
      height: 100%;
      border-radius: inherit;
      background: linear-gradient(90deg, #60a5fa, #34d399);
      transition: width 0.18s ease;
    }

    .primary {
      min-height: 44px;
      border: 0;
      border-radius: 8px;
      color: #ffffff;
      background: var(--blue);
      box-shadow: 0 10px 20px rgba(37, 99, 235, 0.22);
      font-weight: 800;
    }

    .primary:hover {
      background: var(--blue-dark);
    }

    .rule {
      display: grid;
      gap: 4px;
      color: #dce5f2;
      font-size: 13px;
      line-height: 1.45;
    }

    .rule span {
      color: #9fb0c8;
    }

    .main {
      display: flex;
      min-width: 0;
      flex-direction: column;
      background: #f8fafc;
    }

    .topbar {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 14px;
      min-height: 78px;
      padding: 18px 22px;
      border-bottom: 1px solid var(--line);
      background: var(--panel);
    }

    .status {
      color: var(--muted);
      font-size: 13px;
    }

    .cards {
      display: grid;
      grid-template-columns: repeat(4, minmax(0, 1fr));
      gap: 12px;
      padding: 16px 22px;
    }

    .card {
      min-height: 90px;
      padding: 15px;
      border: 1px solid var(--line);
      border-radius: 8px;
      background: var(--panel);
    }

    .card strong {
      display: block;
      font-size: 27px;
      line-height: 1;
    }

    .card span {
      display: block;
      margin-top: 10px;
      color: var(--muted);
      font-size: 13px;
    }

    .workspace {
      display: grid;
      gap: 14px;
      min-height: 0;
      padding: 0 22px 22px;
    }

    .panel {
      border: 1px solid var(--line);
      border-radius: 8px;
      overflow: hidden;
      background: var(--panel);
    }

    .panel-head {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 10px;
      min-height: 52px;
      padding: 0 14px;
      border-bottom: 1px solid var(--line);
      background: var(--soft);
    }

    .logs {
      display: grid;
      gap: 8px;
      max-height: calc(100vh - 292px);
      overflow: auto;
      padding: 12px 14px;
      color: #46576f;
      font-size: 13px;
      line-height: 1.45;
    }

    .log-item {
      padding: 8px 10px;
      border-radius: 8px;
      background: #f8fafc;
      border: 1px solid var(--line);
    }

    .log-item.ok {
      color: #047857;
      background: #dcfce7;
      border-color: #bbf7d0;
    }

    .log-item.warn {
      color: #92400e;
      background: #ffedd5;
      border-color: #fed7aa;
    }

    .log-item.bad {
      color: #9f1239;
      background: #ffe4eb;
      border-color: #fecdd3;
    }

    @media (max-width: 900px) {
      .shell {
        width: min(100% - 20px, 760px);
        padding: 10px 0;
      }

      .layout {
        grid-template-columns: 1fr;
      }

      .cards {
        grid-template-columns: repeat(2, minmax(0, 1fr));
        padding: 16px;
      }

      .workspace,
      .topbar {
        padding-left: 16px;
        padding-right: 16px;
      }
    }
  </style>
</head>
<body>
  <div class="shell">
    <main class="layout">
      <aside class="side">
        <div class="brand">
          <div class="brand-mark">L</div>
          <div>
            <h1>链接渗透率更新</h1>
            <p class="hint">在基准表内更新数据，尽量保留原公式和样式</p>
          </div>
        </div>

        <section class="upload">
          <div class="file-row">
            <label class="file-label" for="baseInput">基准表格</label>
            <span class="file-name" id="baseFileName">未选择文件</span>
          </div>
          <input class="file-input" id="baseInput" type="file" accept=".xlsx,.xlsm">

          <div class="file-row">
            <label class="file-label" for="sourceInput">数据源表格</label>
            <span class="file-name" id="sourceFileName">未选择文件</span>
          </div>
          <input class="file-input" id="sourceInput" type="file" accept=".xlsx,.xls,.csv" multiple>
          <div class="file-list" id="sourceFileList"></div>

          <div class="progress-track"><div class="progress-bar" id="progressBar"></div></div>
          <div class="progress-text" id="progressText">等待添加文件</div>
          <button class="primary" id="updateButton" type="button">更新并导出</button>
        </section>

        <section class="rules">
          <div class="rule"><strong>基准表</strong><span>选择原始“链接渗透率汇总.xlsx”。</span></div>
          <div class="rule"><strong>数据源</strong><span>上传生意参谋、淘宝秒杀、百亿补贴、链接数据。</span></div>
          <div class="rule"><strong>保留规则</strong><span>不重建汇总表；只改指定明细、统计日期和数值格式。</span></div>
          <div class="rule"><strong>导出结果</strong><span>生成“链接渗透率汇总-更新.xlsx”。</span></div>
        </section>

        <p class="hint">如果基准表中“高级运营”列原本是公式，会按原公式位置向下沿用；否则使用数据源里的同名字段。</p>
      </aside>

      <section class="main">
        <header class="topbar">
          <div>
            <h2>更新结果</h2>
            <p class="status" id="statusText">请先选择基准表和数据源</p>
          </div>
          <div class="status" id="libraryText">等待解析组件</div>
        </header>

        <section class="cards">
          <div class="card"><strong id="businessCount">0</strong><span>生意参谋行数</span></div>
          <div class="card"><strong id="seckillCount">0</strong><span>淘宝秒杀行数</span></div>
          <div class="card"><strong id="subsidyCount">0</strong><span>百亿补贴行数</span></div>
          <div class="card"><strong id="linkCount">0</strong><span>链接数据行数</span></div>
        </section>

        <section class="workspace">
          <div class="panel">
            <div class="panel-head">
              <strong>处理记录</strong>
              <span class="status">公式和样式以基准表为准</span>
            </div>
            <div class="logs" id="logList">
              <div class="log-item">等待上传文件。</div>
            </div>
          </div>
        </section>
      </section>
    </main>
  </div>

  <script>
    const baseInput = document.querySelector("#baseInput");
    const sourceInput = document.querySelector("#sourceInput");
    const baseFileName = document.querySelector("#baseFileName");
    const sourceFileName = document.querySelector("#sourceFileName");
    const sourceFileList = document.querySelector("#sourceFileList");
    const progressBar = document.querySelector("#progressBar");
    const progressText = document.querySelector("#progressText");
    const updateButton = document.querySelector("#updateButton");
    const statusText = document.querySelector("#statusText");
    const libraryText = document.querySelector("#libraryText");
    const logList = document.querySelector("#logList");
    const businessCount = document.querySelector("#businessCount");
    const seckillCount = document.querySelector("#seckillCount");
    const subsidyCount = document.querySelector("#subsidyCount");
    const linkCount = document.querySelector("#linkCount");

    let baseFile = null;
    let sourceFiles = [];

    const targetSheets = {
      business: "【生意参谋平台】数据汇总",
      seckill: "【淘宝秒杀】数据汇总",
      subsidy: "【百亿补贴】数据汇总",
      scm: "【SCM】数据汇总",
      summary: "链接渗透率汇总",
      jhsSummary: "聚划算渗透",
      otherSummary: "淘秒、百亿、淘金币渗透",
      coin: "【淘金币】数据汇总"
    };

    const aliases = {
      id: ["商品ID", "商品id", "商品 ID", "活动商品ID", "活动商品id", "宝贝ID", "item_id", "itemid", "auction_id", "链接ID"],
      linkId: ["链接ID", "商品ID", "商品id", "商品 ID", "活动商品ID", "item_id", "itemid"],
      operator: ["高级运营", "高级", "运营", "负责人", "高级运营负责人"],
      date: ["统计日期", "日期", "数据日期"],
      pay: ["支付金额", "支付金额(元)", "支付金额（元）", "付款金额", "成交金额", "成交GMV", "成交GMV(元)", "成交GMV（元）"],
      jhsPay: ["聚划算支付金额", "聚划算成交金额", "聚划算GMV"],
      seckillPay: ["成交金额", "成交GMV", "支付金额"],
      subsidyPay: ["成交GMV", "成交GMV(元)", "成交GMV（元）", "支付金额", "成交金额"]
    };

    function normalize(value) {
      return String(value ?? "")
        .replace(/\s+/g, "")
        .replace(/[()（）_\-]/g, "")
        .toLowerCase();
    }

    function escapeHtml(value) {
      return String(value ?? "").replace(/[&<>"']/g, (char) => ({
        "&": "&amp;",
        "<": "&lt;",
        ">": "&gt;",
        '"': "&quot;",
        "'": "&#039;"
      }[char]));
    }

    function findHeaderIndex(rows) {
      let bestIndex = 0;
      let bestScore = -1;
      const groups = [aliases.id, aliases.operator, aliases.date, aliases.pay];
      rows.slice(0, 30).forEach((row, index) => {
        const cells = row.map(normalize).filter(Boolean);
        const score = groups.reduce((sum, group) => {
          const names = group.map(normalize);
          return sum + (cells.some((cell) => names.some((name) => cell === name || cell.includes(name) || name.includes(cell))) ? 1 : 0);
        }, 0);
        if (score > bestScore) {
          bestScore = score;
          bestIndex = index;
        }
      });
      return bestIndex;
    }

    function findKey(row, names) {
      const keys = Object.keys(row);
      const normalizedNames = names.map(normalize);
      return keys.find((key) => normalizedNames.includes(normalize(key)))
        || keys.find((key) => normalizedNames.some((name) => normalize(key).includes(name)));
    }

    function getValue(row, names) {
      const key = findKey(row, names);
      return key ? row[key] : "";
    }

    function cleanId(value) {
      const text = String(value ?? "").trim();
      if (!text) return "";
      if (/^\d+(\.0+)?$/.test(text)) return text.replace(/\.0+$/, "");
      return text;
    }

    function toNumber(value) {
      const text = String(value ?? "").replace(/,/g, "").replace(/[^\d.-]/g, "");
      if (!text) return "";
      const number = Number(text);
      return Number.isFinite(number) ? number : value;
    }

    function formatDate(value) {
      if (value instanceof Date && !Number.isNaN(value.getTime())) {
        return `${value.getFullYear()}-${String(value.getMonth() + 1).padStart(2, "0")}-${String(value.getDate()).padStart(2, "0")}`;
      }
      const text = String(value ?? "").trim();
      const match = text.match(/(\d{4})[\/\-.年](\d{1,2})[\/\-.月](\d{1,2})/);
      if (match) return `${match[1]}-${match[2].padStart(2, "0")}-${match[3].padStart(2, "0")}`;
      const serial = Number(text);
      if (Number.isFinite(serial) && serial > 30000 && serial < 60000) {
        const date = new Date(Math.round((serial - 25569) * 86400 * 1000));
        return `${date.getUTCFullYear()}-${String(date.getUTCMonth() + 1).padStart(2, "0")}-${String(date.getUTCDate()).padStart(2, "0")}`;
      }
      return text;
    }

    function classifySource(fileName, sheetName) {
      const name = `${fileName} ${sheetName}`;
      if (name.includes("生意参谋")) return "business";
      if (name.includes("淘宝秒杀") || name.includes("淘秒")) return "seckill";
      if (name.includes("百亿补贴")) return "subsidy";
      if (name.includes("链接数据") || name.includes("SCM")) return "link";
      return "";
    }

    function usedValues(sheet) {
      const range = sheet.usedRange();
      return range ? range.value() : [];
    }

    async function readSourceFile(file) {
      const workbook = XLSX.read(await file.arrayBuffer(), { type: "array", raw: false, cellDates: true });
      const items = [];
      workbook.SheetNames.forEach((sheetName) => {
        const sheet = workbook.Sheets[sheetName];
        const values = XLSX.utils.sheet_to_json(sheet, { header: 1, defval: "", raw: false });
        if (!values.length) return;
        const headerIndex = findHeaderIndex(values);
        const headers = values[headerIndex].map((cell, index) => String(cell || `空列${index + 1}`).trim());
        const rows = values.slice(headerIndex + 1)
          .filter((line) => line.some((cell) => String(cell ?? "").trim() !== ""))
          .map((line) => {
            const row = {};
            headers.forEach((header, index) => {
              row[header] = line[index] ?? "";
            });
            return row;
          });
        items.push({
          fileName: file.name,
          sheetName,
          type: classifySource(file.name, sheetName),
          rows
        });
      });
      return items;
    }

    function byType(items, type) {
      return items.filter((item) => item.type === type).flatMap((item) => item.rows);
    }

    function sourceValue(sourceRow, targetHeader, sheetType) {
      if (sheetType === "business" && normalize(targetHeader) === normalize("支付金额")) return toNumber(getValue(sourceRow, aliases.pay));
      if (sheetType === "business" && normalize(targetHeader) === normalize("聚划算支付金额")) return toNumber(getValue(sourceRow, aliases.jhsPay));
      if (sheetType === "seckill" && normalize(targetHeader) === normalize("成交金额")) return toNumber(getValue(sourceRow, aliases.seckillPay));
      if (sheetType === "subsidy" && /成交gmv|支付金额|成交金额/.test(normalize(targetHeader))) return toNumber(getValue(sourceRow, aliases.subsidyPay));
      const exact = findKey(sourceRow, [targetHeader]);
      if (exact) return sourceRow[exact];
      if (aliases.id.map(normalize).includes(normalize(targetHeader))) return cleanId(getValue(sourceRow, aliases.id));
      if (aliases.date.map(normalize).includes(normalize(targetHeader))) return formatDate(getValue(sourceRow, aliases.date));
      if (aliases.operator.map(normalize).includes(normalize(targetHeader))) return getValue(sourceRow, aliases.operator);
      return "";
    }

    function adjustFormulaRow(formula, fromRow, toRow) {
      if (!formula || fromRow === toRow) return formula;
      return formula.replace(/(\$?[A-Z]{1,3})(\$?)(\d+)/g, (match, col, lock, row) => {
        if (lock === "$") return match;
        return Number(row) === fromRow ? `${col}${toRow}` : match;
      });
    }

    function clearCell(cell) {
      cell.value("");
    }

    function updateDataSheet(workbook, sheetName, rows, sheetType, log) {
      const sheet = workbook.sheet(sheetName);
      if (!sheet) {
        log(`未找到工作表：${sheetName}`, "bad");
        return;
      }
      const values = usedValues(sheet);
      const headerRow = findHeaderIndex(values) + 1;
      const headers = values[headerRow - 1].map((cell) => String(cell ?? "").trim());
      const usedRows = sheet.usedRange()?.endCell()?.rowNumber() || headerRow;
      const formulaSamples = {};
      headers.forEach((header, index) => {
        const col = index + 1;
        const sample = sheet.cell(headerRow + 1, col);
        if (sample.formula()) formulaSamples[col] = sample.formula();
      });

      for (let rowNumber = headerRow + 1; rowNumber <= Math.max(usedRows, headerRow + rows.length); rowNumber += 1) {
        headers.forEach((header, index) => {
          const col = index + 1;
          const cell = sheet.cell(rowNumber, col);
          const sourceRow = rows[rowNumber - headerRow - 1];
          if (!sourceRow) {
            clearCell(cell);
            return;
          }
          if (formulaSamples[col]) {
            cell.formula(adjustFormulaRow(formulaSamples[col], headerRow + 1, rowNumber));
            return;
          }
          cell.value(sourceValue(sourceRow, header, sheetType));
        });
      }
      log(`${sheetName} 已更新 ${rows.length} 行`, "ok");
    }

    function updateScmSheet(workbook, rows, log) {
      const sheet = workbook.sheet(targetSheets.scm);
      if (!sheet) {
        log(`未找到工作表：${targetSheets.scm}`, "bad");
        return;
      }
      const usedRows = sheet.usedRange()?.endCell()?.rowNumber() || 1;
      sheet.cell(1, 1).value("链接ID");
      sheet.cell(1, 2).value("高级运营");
      const data = rows.map((row) => ({
        id: cleanId(getValue(row, aliases.linkId)),
        operator: getValue(row, aliases.operator)
      })).filter((row) => row.id || row.operator);
      for (let index = 0; index < Math.max(data.length, usedRows - 1); index += 1) {
        const rowNumber = index + 2;
        sheet.cell(rowNumber, 1).value(data[index]?.id || "");
        sheet.cell(rowNumber, 2).value(data[index]?.operator || "");
      }
      log(`${targetSheets.scm} 前两列已按链接数据覆盖 ${data.length} 行`, "ok");
    }

    function setNumberFormats(workbook, log) {
      const specs = [
        [targetSheets.business, ["支付金额", "聚划算支付金额"]],
        [targetSheets.seckill, ["成交金额"]],
        [targetSheets.subsidy, ["成交GMV", "支付金额", "成交金额"]]
      ];
      specs.forEach(([sheetName, names]) => {
        const sheet = workbook.sheet(sheetName);
        if (!sheet) return;
        const values = usedValues(sheet);
        const headerRow = findHeaderIndex(values) + 1;
        const headers = values[headerRow - 1].map((cell) => String(cell ?? "").trim());
        const rows = sheet.usedRange()?.endCell()?.rowNumber() || headerRow;
        headers.forEach((header, index) => {
          if (!names.some((name) => normalize(name) === normalize(header))) return;
          const col = index + 1;
          for (let row = headerRow + 1; row <= rows; row += 1) {
            const cell = sheet.cell(row, col);
            const num = toNumber(cell.value());
            if (num !== "") cell.value(num);
            cell.style("numberFormat", "0.00");
          }
        });
      });
      log("指定金额列已调整为数值格式", "ok");
    }

    function updateDateColumn(sheet, dateText) {
      if (!sheet) return 0;
      const values = usedValues(sheet);
      if (!values.length) return 0;
      const headerRow = findHeaderIndex(values) + 1;
      const headers = values[headerRow - 1].map((cell) => String(cell ?? "").trim());
      const dateCol = headers.findIndex((header) => aliases.date.map(normalize).includes(normalize(header))) + 1;
      if (!dateCol) return 0;
      const endRow = sheet.usedRange()?.endCell()?.rowNumber() || headerRow;
      for (let row = headerRow + 1; row <= endRow; row += 1) {
        sheet.cell(row, dateCol).value(dateText);
        sheet.cell(row, dateCol).style("numberFormat", "yyyy-mm-dd");
      }
      return Math.max(0, endRow - headerRow);
    }

    function pickDate(rows) {
      const counts = new Map();
      rows.forEach((row) => {
        const date = formatDate(getValue(row, aliases.date));
        if (date) counts.set(date, (counts.get(date) || 0) + 1);
      });
      return Array.from(counts.entries()).sort((a, b) => b[1] - a[1])[0]?.[0]
        || formatDate(new Date());
    }

    function downloadBlob(blob, fileName) {
      const url = URL.createObjectURL(blob);
      const link = document.createElement("a");
      link.href = url;
      link.download = fileName;
      document.body.appendChild(link);
      link.click();
      link.remove();
      URL.revokeObjectURL(url);
    }

    async function updateWorkbook() {
      if (!baseFile) {
        statusText.textContent = "请先选择基准表格";
        return;
      }
      if (!sourceFiles.length) {
        statusText.textContent = "请先选择数据源表格";
        return;
      }
      if (!window.XlsxPopulate || !window.XLSX) {
        statusText.textContent = "解析组件加载失败";
        renderLogs([{ text: "当前浏览器没有成功加载 Excel 更新组件，请确认能访问 cdn.jsdelivr.net 后刷新页面。", level: "bad" }]);
        return;
      }

      const logs = [];
      const log = (text, level = "") => {
        logs.push({ text, level });
        renderLogs(logs);
      };

      try {
        setProgress(5, "正在读取数据源");
        statusText.textContent = "正在读取数据源...";
        const sourceItems = [];
        for (let index = 0; index < sourceFiles.length; index += 1) {
          sourceItems.push(...await readSourceFile(sourceFiles[index]));
          setProgress(10 + Math.round(((index + 1) / sourceFiles.length) * 35), `已读取 ${index + 1} / ${sourceFiles.length} 个数据源`);
        }

        const businessRows = byType(sourceItems, "business");
        const seckillRows = byType(sourceItems, "seckill");
        const subsidyRows = byType(sourceItems, "subsidy");
        const linkRows = byType(sourceItems, "link");
        businessCount.textContent = businessRows.length;
        seckillCount.textContent = seckillRows.length;
        subsidyCount.textContent = subsidyRows.length;
        linkCount.textContent = linkRows.length;

        log(`识别到生意参谋 ${businessRows.length} 行、淘宝秒杀 ${seckillRows.length} 行、百亿补贴 ${subsidyRows.length} 行、链接数据 ${linkRows.length} 行。`, "ok");
        if (!businessRows.length) log("没有识别到生意参谋数据源。", "warn");
        if (!seckillRows.length) log("没有识别到淘宝秒杀数据源。", "warn");
        if (!subsidyRows.length) log("没有识别到百亿补贴数据源。", "warn");
        if (!linkRows.length) log("没有识别到链接数据。", "warn");

        setProgress(52, "正在读取基准表");
        statusText.textContent = "正在读取基准表...";
        const workbook = await XlsxPopulate.fromDataAsync(await baseFile.arrayBuffer());
        const dateText = pickDate(businessRows);
        log(`统计日期将更新为 ${dateText}。`, "ok");

        setProgress(65, "正在更新明细工作表");
        updateDataSheet(workbook, targetSheets.business, businessRows, "business", log);
        updateDataSheet(workbook, targetSheets.seckill, seckillRows, "seckill", log);
        updateDataSheet(workbook, targetSheets.subsidy, subsidyRows, "subsidy", log);
        updateScmSheet(workbook, linkRows, log);

        setProgress(80, "正在更新日期和数值格式");
        setNumberFormats(workbook, log);
        [targetSheets.business, targetSheets.seckill, targetSheets.subsidy, targetSheets.coin, targetSheets.summary, targetSheets.jhsSummary, targetSheets.otherSummary].forEach((sheetName) => {
          const count = updateDateColumn(workbook.sheet(sheetName), dateText);
          if (count) log(`${sheetName} 统计日期已更新 ${count} 行`, "ok");
        });

        setProgress(92, "正在生成文件");
        statusText.textContent = "正在生成文件...";
        const blob = await workbook.outputAsync("blob");
        downloadBlob(blob, "链接渗透率汇总-更新.xlsx");
        setProgress(100, "更新完成，文件已导出");
        statusText.textContent = "更新完成";
        log("已导出：链接渗透率汇总-更新.xlsx", "ok");
      } catch (error) {
        setProgress(0, "更新失败");
        statusText.textContent = "更新失败";
        log(`更新失败：${error.message}`, "bad");
      }
    }

    function renderLogs(logs) {
      logList.innerHTML = logs.map((log) => `<div class="log-item ${escapeHtml(log.level)}">${escapeHtml(log.text)}</div>`).join("");
    }

    function setProgress(percent, text) {
      progressBar.style.width = `${percent}%`;
      progressText.textContent = text;
    }

    function updateFileText() {
      baseFileName.textContent = baseFile ? baseFile.name : "未选择文件";
      sourceFileName.textContent = sourceFiles.length ? `${sourceFiles.length} 个文件` : "未选择文件";
      sourceFileList.innerHTML = sourceFiles.map((file) => `<div class="file-chip" title="${escapeHtml(file.name)}">${escapeHtml(file.name)}</div>`).join("");
      setProgress(0, sourceFiles.length || baseFile ? "等待更新" : "等待添加文件");
    }

    baseInput.addEventListener("change", () => {
      baseFile = baseInput.files?.[0] || null;
      updateFileText();
    });

    sourceInput.addEventListener("change", () => {
      sourceFiles = Array.from(sourceInput.files || []);
      updateFileText();
    });

    updateButton.addEventListener("click", updateWorkbook);

    if (window.XlsxPopulate && window.XLSX) {
      libraryText.textContent = "解析组件已加载";
    } else {
      libraryText.textContent = "解析组件未加载";
      renderLogs([{ text: "Excel 更新组件未加载。网页发布后如仍提示未加载，请检查网络是否可访问 cdn.jsdelivr.net。", level: "bad" }]);
    }
  </script>
</body>
</html>
